# llama.cpp router presets: llama-server --models-preset models.ini --models-max 1 (started by llama-swap, see config.yaml).
# Paths are inside the container: the host models folder is mounted at /models.
# Tuned on 2x RTX 3060 12 GB (GPU0 PCIe x8, GPU1 x4) + 64 GB RAM. Every preset: MTP drafting (2 tokens), q8_0 KV for
# model + draft, one slot. Contexts are the largest that loaded AND answered on that box; gen tok/s = code / prose.
# Built from my llama.cpp fork. Two keys may differ on upstream llama.cpp: `no-mmap` (upstream uses `load-mode`) and
# `spec-type = draft-mtp` (MTP drafting). Check `llama-server --help` on your build and adjust those two lines.

[*]
# unload the model (free VRAM) after 10 idle minutes; the next request reloads it (~11 s for the 27B)
sleep-idle-seconds = 600
ngl = 99
fa = on
jinja = 1
metrics = 1
no-mmap = 1
parallel = 1
cache-reuse = 256
threads = 11
batch-size = 2048
ctk = q8_0
ctv = q8_0
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0

# Dense 27B, GSQ-RCO IQ3_S + MTP head (ISTA-DASLab, 12.1 GB, task-lossless per its card; replaced Q4_K_M 17.1 GB).
# tensor + MTP 2: ~56 t/s at empty context, 27.9 t/s at 189k (verified by filling 95%); layer mode is 2x slower at depth.
# GSQ-RCO 27B: 163,840 context with the Q8_0 vision projector on GPU0 (196,608 without it). tensor + MTP 2.
[qwen38-27b-gsq]
alias = qwen38-27b-gsq
model = /models/Qwen3.8-27B-GSQ-RCO-GGUF/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
split-mode = tensor
ctx-size = 163840
ubatch-size = 512
mmproj = /models/Qwen3.8-27B-mmproj/mmproj-Q8_0.gguf



# Same GSQ-RCO 27B at 100k context: leaves VRAM free for voice models (TTS/STT) alongside.
[qwen38-27b-gsq-100k]
alias = qwen38-27b-gsq-100k
model = /models/Qwen3.8-27B-GSQ-RCO-GGUF/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
split-mode = tensor
tensor-split = 35,65
ctx-size = 102400
ubatch-size = 512
mmproj = /models/Qwen3.8-27B-mmproj/mmproj-Q8_0.gguf



# Voice mode: the gsq-100k preset at 64k context. Breeze TTS loads on GPU0 beside it
# (weights ~3.9 GB + a ~551 MiB decode graph); at 100k the decode graph did not fit.
[qwen38-27b-gsq-64k]
alias = qwen38-27b-gsq-64k
model = /models/Qwen3.8-27B-GSQ-RCO-GGUF/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
split-mode = tensor
tensor-split = 35,65
ctx-size = 65536
ubatch-size = 512
mmproj = /models/Qwen3.8-27B-mmproj/mmproj-Q8_0.gguf
# Dense 27B, unsloth Q4_K_M (17.1 GB), kept for comparison with the GSQ-RCO build. tensor + MTP 2: 55 / 46 t/s.
# 81,920 context with the Q8_0 vision projector on GPU0 (114,688 without it; another GPU app idled ~100 MB/card).
[qwen38-27b-q4km]
alias = qwen38-27b-q4km
model = /models/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf
split-mode = tensor
ctx-size = 81920
ubatch-size = 512
mmproj = /models/Qwen3.8-27B-mmproj/mmproj-Q8_0.gguf

# 128k, tensor split: experts of 8 layers on the CPU (4 before the vision projector). Q8_0 projector (600 MB, BF16 needed 9).
# With mmproj: 97.4 t/s code, image 1.8 s.
[qwen36-35b-a3b-128k]
alias = qwen36-35b-a3b-128k
model = /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
split-mode = tensor
n-cpu-moe = 10
ctx-size = 131072
ubatch-size = 512
mmproj = /models/Qwen3.6-35B-A3B-mmproj/mmproj-Q8_0.gguf

# Full 262k: experts of 11 layers on the CPU (10 before the vision projector; Q8_0 projector, BF16 needed 12). Layer split beats tensor here (98 / 82 vs 94 / 75): the CPU experts
# are copied to GPU0 for prefill instead of computed on the CPU. -ts 60,40 because the MTP layer sits on GPU1.
[qwen36-35b-a3b-256k]
alias = qwen36-35b-a3b-256k
model = /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
split-mode = layer
tensor-split = 60,40
n-cpu-moe = 13
ctx-size = 262144
ubatch-size = 512
mmproj = /models/Qwen3.6-35B-A3B-mmproj/mmproj-Q8_0.gguf

# Ornith 1.5 35B-A3B (qwen35moe, official Q4_K_M 21.7 GB, MTP layer built in): same two layouts as the Qwen 35B presets.
# Sampling from the model card (general tasks): temp 0.6, top_p 0.95, top_k 20.
[ornith-35b-128k]
alias = ornith-35b-128k
model = /models/Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf
split-mode = none
device = CUDA0
n-cpu-moe = 29
ctx-size = 131072
ubatch-size = 1024
mmproj = /models/Ornith-1.5-35B-A3B-GGUF/mmproj-Ornith-1.5-35B-Q8_0.gguf
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

[ornith-35b-256k]
alias = ornith-35b-256k
model = /models/Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf
split-mode = layer
tensor-split = 60,40
n-cpu-moe = 12
ctx-size = 262144
ubatch-size = 512
mmproj = /models/Ornith-1.5-35B-A3B-GGUF/mmproj-Ornith-1.5-35B-Q8_0.gguf
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

# Qwen3.6-35B-A3B Uncensored (HauhauCS Aggressive, Q4_K_M 21.2 GB, f16 vision projector from the same repo).
# Same layout as qwen36-35b-a3b-128k, but this GGUF has no MTP layer (40 blocks, no nextn), so no drafting.
# Sampling from the model card (thinking, general): temp 1.0, top_p 0.95, top_k 20, presence 1.5.
[qwen36-35b-uncensored-128k]
alias = qwen36-35b-uncensored-128k
model = /models/Qwen3.6-35B-A3B-Uncensored-GGUF/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
spec-type = none
split-mode = tensor
n-cpu-moe = 10
ctx-size = 131072
ubatch-size = 512
mmproj = /models/Qwen3.6-35B-A3B-Uncensored-GGUF/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
